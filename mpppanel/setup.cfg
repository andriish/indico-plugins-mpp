[metadata]
name = indico-plugin-mpppanel
version = 0.2
description = Per-room signage pages with the bookings of the day for Indico
long_description = file: README.md
long_description_content_type = text/markdown; charset=UTF-8; variant=GFM
url = https://github.com/andriish/indico-plugins-mpp
license = MIT
author = Andrii Verbytskyi
author_email = andrii.verbytskyi@mpp.mpg.de
classifiers =
    Environment :: Plugins
    Environment :: Web Environment
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13

[options]
packages = find:
zip_safe = false
include_package_data = true
python_requires = >=3.12
install_requires =
    indico>=3.3.dev0
    pytz

[options.entry_points]
indico.plugins =
    mpppanel = indico_mpppanel.plugin:MPPPanelPlugin



[pydocstyle]
ignore = D100,D101,D102,D103,D104,D105,D107,D203,D213
